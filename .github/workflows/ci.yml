name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test and release build
        shell: bash
        run: bash scripts/ci.sh
      - name: Collect binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          suffix=""
          if [ -f target/release/pharos-server.exe ]; then
            suffix=".exe"
          fi
          cp "target/release/pharos-server${suffix}" "dist/pharos-server-${RUNNER_OS}${suffix}"
          cp "target/release/pharos-client${suffix}" "dist/pharos-client-${RUNNER_OS}${suffix}"
      - uses: actions/upload-artifact@v4
        with:
          name: pharos-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: pharos-*
          merge-multiple: false
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
