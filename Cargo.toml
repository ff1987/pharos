[workspace]
resolver = "2"
members = [
    "crates/pharos-proto",
    "crates/pharos-server",
    "crates/pharos-client",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88"
authors = ["Pharos contributors"]

[workspace.dependencies]
anyhow = "1.0"
bytes = "1.9"
clap = { version = ">=4.5.40, <4.6", features = ["derive"] }
quinn = "=0.11.9"
rcgen = ">=0.14.5, <0.14.8"
rustls = { version = ">=0.23.20, <0.24", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = ">=0.10.8, <0.11"
subtle = "2.6"
thiserror = ">=2.0.11, <3"
tokio = { version = ">=1.40, <1.54", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = ">=0.26.2, <0.27"
toml = ">=0.8.19, <0.9"
tracing = "0.1.41"
tracing-subscriber = { version = ">=0.3.18, <0.4", features = ["env-filter", "fmt", "json"] }
